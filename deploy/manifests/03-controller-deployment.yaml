apiVersion: apps/v1
kind: Deployment
metadata:
  name: cronops-controller
  namespace: cronops
  labels:
    app.kubernetes.io/name: cronops-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cronops-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cronops-controller
    spec:
      serviceAccountName: cronops-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/alexpokatilov/cronops-controller:latest
          args:
            - --leader-elect=true
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
