# EXAMPLE ONLY — generate real values before applying.
#
# UI users: each data key is a username, the value is a bcrypt hash of the
# password. Generate a hash with:
#   htpasswd -bnBC 10 "" 'your-password' | tr -d ':\n' | sed 's/$2y/$2a/'
#
# JWT signing key:
#   openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: cronops-users
  namespace: cronops
type: Opaque
stringData:
  admin: "$2a$10$REPLACE_WITH_BCRYPT_HASH"
---
apiVersion: v1
kind: Secret
metadata:
  name: cronops-jwt-key
  namespace: cronops
type: Opaque
stringData:
  key: "REPLACE_WITH_RANDOM_32_BYTE_KEY"
