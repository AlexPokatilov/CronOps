apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronops-server
  namespace: cronops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cronops-server
rules:
  # Full CRUD on the spec; status stays read-only — only the controller writes it.
  - apiGroups: ["cronops.io"]
    resources: ["httpcronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cronops.io"]
    resources: ["httpcronjobs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cronops-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cronops-server
subjects:
  - kind: ServiceAccount
    name: cronops-server
    namespace: cronops
---
# Read UI users and the JWT signing key in its own namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronops-server-secrets
  namespace: cronops
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["cronops-users", "cronops-jwt-key"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronops-server-secrets
  namespace: cronops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cronops-server-secrets
subjects:
  - kind: ServiceAccount
    name: cronops-server
    namespace: cronops
