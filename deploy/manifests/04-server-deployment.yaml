apiVersion: apps/v1
kind: Deployment
metadata:
  name: cronops-server
  namespace: cronops
  labels:
    app.kubernetes.io/name: cronops-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cronops-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cronops-server
    spec:
      serviceAccountName: cronops-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/alexpokatilov/cronops-server:latest
          args:
            - --listen=:8090
            - --static=/web/dist
          env:
            - name: CRONOPS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cronops-server
  namespace: cronops
  labels:
    app.kubernetes.io/name: cronops-server
spec:
  selector:
    app.kubernetes.io/name: cronops-server
  ports:
    - name: http
      port: 80
      targetPort: http
