              retry:
                description: Retry re-runs failed attempts with exponential backoff.
                properties:
                  backoffSeconds:
                    default: 10
                    description: |-
                      BackoffSeconds is the delay before the first retry; each subsequent
                      retry doubles it (exponential backoff).
