            properties:
              auth:
                description: |-
                  AuthSpec describes how the request to the endpoint is authenticated.
                  Credentials are never stored in the spec — only referenced from Secrets.
                properties:
                  headerName:
                    description: HeaderName carries the api key for type=apiKey. Defaults
                      to "X-API-Key".
                    type: string
                  secretRef:
                    description: SecretKeyRef points to a key inside a Secret in the
