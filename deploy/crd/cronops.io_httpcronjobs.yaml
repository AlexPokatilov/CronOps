                maximum: 200
                minimum: 1
                type: integer
              runTTLSecondsAfterFinished:
                description: |-
                  RunTTLSecondsAfterFinished, when set, deletes finished
                  HttpCronJobRun objects this many seconds after they complete.
                format: int32
                minimum: 60
                type: integer
              schedule:
                description: Schedule in standard 5-field cron syntax, e.g. "0 3 *
