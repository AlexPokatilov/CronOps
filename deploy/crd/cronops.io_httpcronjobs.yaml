                      format: int32
                      type: integer
                    durationMs:
                      description: DurationMs is the wall-clock run time in milliseconds.
                      format: int64
                      type: integer
                    finishedAt:
                      format: date-time
                      type: string
                    httpStatusCode:
                      format: int32
                      type: integer
                    message:
                      type: string
                    responseBody:
