                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              history:
                description: History holds the most recent runs, newest first, capped
                  by spec.historyLimit.
                items:
                  description: RunResult records the outcome of a single run.
                  properties:
                    attempts:
                      description: Attempts is how many HTTP attempts the run took
