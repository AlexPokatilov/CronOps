apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronops-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cronops.io"]
    resources: ["httpcronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cronops.io"]
    resources: ["httpcronjobs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-controller
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-controller
subjects:
  - kind: ServiceAccount
    name: cronops-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronops-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronops-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cronops-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: cronops-controller
    namespace: {{ .Release.Namespace }}
