{{- if .Values.auth.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: cronops-users
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $user, $hash := .Values.auth.users }}
  {{ $user }}: {{ $hash | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cronops-jwt-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ required "auth.jwtKey is required when auth.createSecrets=true" .Values.auth.jwtKey | quote }}
{{- end }}
