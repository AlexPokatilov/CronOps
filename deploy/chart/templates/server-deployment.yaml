apiVersion: apps/v1
kind: Deployment
metadata:
  name: cronops-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cronops-server
    {{- include "cronops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cronops-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cronops-server
    spec:
      serviceAccountName: cronops-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          args:
            - --listen=:8090
            - --static=/web/dist
          env:
            - name: CRONOPS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cronops-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cronops-server
    {{- include "cronops.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    app.kubernetes.io/name: cronops-server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
