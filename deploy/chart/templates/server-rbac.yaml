apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronops-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cronops.io"]
    resources: ["httpcronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cronops.io"]
    resources: ["httpcronjobs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-server
subjects:
  - kind: ServiceAccount
    name: cronops-server
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronops-server-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["cronops-users", "cronops-jwt-key"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronops-server-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cronops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cronops-server-secrets
subjects:
  - kind: ServiceAccount
    name: cronops-server
    namespace: {{ .Release.Namespace }}
