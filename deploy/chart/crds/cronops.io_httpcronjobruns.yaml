---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: httpcronjobruns.cronops.io
spec:
  group: cronops.io
  names:
    kind: HttpCronJobRun
    listKind: HttpCronJobRunList
    plural: httpcronjobruns
    shortNames:
    - hcjr
    singular: httpcronjobrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.jobName
      name: Job
      type: string
    - jsonPath: .spec.trigger
      name: Trigger
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.httpStatusCode
      name: Code
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HttpCronJobRun is one execution of a HttpCronJob: a full, queryable run
          history that outlives the bounded status.history ring buffer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              HttpCronJobRunSpec describes a single requested run of a HttpCronJob.
              The controller creates these for scheduled runs; the API server creates
              them with trigger=Manual for run-now requests.
            properties:
              jobName:
                description: JobName is the HttpCronJob (same namespace) this run
                  belongs to.
                minLength: 1
                type: string
              trigger:
                default: Manual
                description: Trigger records what requested the run.
                enum:
                - Schedule
                - Manual
                type: string
            required:
            - jobName
            type: object
          status:
            description: HttpCronJobRunStatus is the observed outcome of the run.
            properties:
              attempts:
                description: Attempts is how many HTTP attempts were made (retries
                  included).
                format: int32
                type: integer
              durationMs:
                description: DurationMs is the wall-clock run time in milliseconds.
                format: int64
                type: integer
              finishedAt:
                format: date-time
                type: string
              httpStatusCode:
                format: int32
                type: integer
              message:
                type: string
              phase:
                enum:
                - Running
                - Succeeded
                - Failed
                - Cancelled
                - Skipped
                type: string
              responseBody:
                description: |-
                  ResponseBody is a truncated snippet of the response body
                  (see HttpCronJob spec.captureResponseBody).
                type: string
              startedAt:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
