name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  go:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # PRs: build images only. Pushes to main / v* tags: build and publish to GHCR.
  docker:
    name: Container images
    runs-on: ubuntu-latest
    needs: [go, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Controller image metadata
        id: meta-controller
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alexpokatilov/cronops-controller
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Server image metadata
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alexpokatilov/cronops-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Build/push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.controller
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-controller.outputs.tags }}
          labels: ${{ steps.meta-controller.outputs.labels }}
      - name: Build/push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}

  helm:
    name: Helm chart (publish to GHCR OCI)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package and push chart
        run: |
          VERSION=$(awk '/^version:/{print $2}' deploy/chart/Chart.yaml)
          APP_VERSION=$(awk '/^appVersion:/{gsub(/"/,"",$2); print $2}' deploy/chart/Chart.yaml)
          # Releases (v* tags) override the chart version with the tag.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            APP_VERSION="${VERSION}"
          fi
          helm package deploy/chart --version "${VERSION}" --app-version "${APP_VERSION}"
          helm push "cronops-${VERSION}.tgz" oci://ghcr.io/alexpokatilov/charts
